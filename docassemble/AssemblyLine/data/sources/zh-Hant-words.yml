  "Title": "標題"
  "Untitled interview": "未命名訪談"
  "Use a keyword to find results that match the title or description of a form.": "使用關鍵字尋找與表格標題或說明相符的結果。"
  "View": "檢視"
  "View, delete, or rename your answer sets below. Start a new form to reuse an answer set.": "在下方檢視、刪除或重新命名您的答案集。開始填寫新表格即可再次使用答案集。"
  "an exhibit": "一份證據資料"
  "{documents} could not be processed and won't be included. Please try uploading it again before you continue.": "無法處理{documents}，因此不會包含該文件。請在繼續之前嘗試重新上傳。"
  "{documents} could not be processed and won't be included. Please try uploading them again before you continue.": "無法處理{documents}，因此不會包含這些文件。請在繼續之前嘗試重新上傳。"

