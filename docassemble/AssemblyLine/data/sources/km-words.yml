  "Change country, selected ${countryName} (${dialCode})": "ប្តូរប្រទេស ប្រទេសដែលបានជ្រើសរើស ${countryName} (${dialCode})"
  "Select country": "ជ្រើសរើសប្រទេស"
  "List of countries": "បញ្ជីប្រទេស"
  "Search": "ស្វែងរក"
  "Clear search": "សម្អាតការស្វែងរក"
  "No results found": "រកមិនឃើញលទ្ធផល"
