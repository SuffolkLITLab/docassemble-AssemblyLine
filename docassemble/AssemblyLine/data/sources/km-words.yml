  "Sorry, these answers couldn't be copied right now. Try starting a new form instead.": "សូមអភ័យទោស មិនអាចចម្លងចម្លើយទាំងនេះបានទេនៅពេលនេះ។ សូមសាកល្បងចាប់ផ្តើមទម្រង់ថ្មីជំនួសវិញ។"
  "Start a new form": "ចាប់ផ្តើមទម្រង់ថ្មី"
