  "Untitled interview": "បទសម្ភាសន៍គ្មានចំណងជើង"
  "Use a keyword to find results that match the title or description of a form.": "ប្រើពាក្យគន្លឹះ ដើម្បីរកលទ្ធផលដែលត្រូវនឹងចំណងជើង ឬការពិពណ៌នារបស់ទម្រង់។"
  "View": "មើល"
  "View, delete, or rename your answer sets below. Start a new form to reuse an answer set.": "មើល លុប ឬប្តូរឈ្មោះសំណុំចម្លើយរបស់អ្នកខាងក្រោម។ ចាប់ផ្តើមទម្រង់ថ្មី ដើម្បីប្រើសំណុំចម្លើយម្តងទៀត។"
  "an exhibit": "ឯកសារភស្តុតាងមួយ"
  "{documents} could not be processed and won't be included. Please try uploading it again before you continue.": "មិនអាចដំណើរការ {documents} បានទេ ហើយឯកសារនេះនឹងមិនត្រូវបានដាក់បញ្ចូលទេ។ សូមសាកល្បងផ្ទុកវាឡើងម្តងទៀត មុនពេលបន្ត។"
  "{documents} could not be processed and won't be included. Please try uploading them again before you continue.": "មិនអាចដំណើរការ {documents} បានទេ ហើយឯកសារទាំងនេះនឹងមិនត្រូវបានដាក់បញ្ចូលទេ។ សូមសាកល្បងផ្ទុកពួកវាឡើងម្តងទៀត មុនពេលបន្ត។"
